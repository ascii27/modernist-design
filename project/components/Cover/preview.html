<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modernist</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-heading); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; }
  .art svg { display: block; width: 480px; height: 288px; }
  .accent { fill: var(--color-accent); }
  .ink { fill: var(--color-text); }
  .tint { fill: var(--color-accent-300); }
  .blk { rx: var(--radius-md); }
  .rule { stroke: var(--color-divider); stroke-width: 2px; }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 80px; line-height: .92; font-weight: var(--font-heading-weight); letter-spacing: -0.015em; color: var(--color-text); }
  .tag { margin: var(--space-2) 0 0; font-family: var(--font-body); font-size: 14px; line-height: 20px; color: var(--color-neutral-700); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      color-accent 192×288 slab (two cells merged, full height) · color-text 96×192 · color-accent-300 96×96 tint · color-accent 96×96 satellite — ≈33% of 960×288
  arrangement a flush modular grid of 96px cells (3 × space-8), blocks filling whole cells, the slab bleeding top and bottom
  pattern     the visible grid itself as 2px color-divider rules (3 vertical, 2 horizontal), from "a visible modular grid … strong 2px rules"
  scales      cell pitch 96 = 3 × space-8; rule weight 2px (.hr); corners radius-md (0)
-->
<rect class="accent blk" x="0" y="0" width="192" height="288" rx="0"/>
<rect class="ink blk" x="192" y="96" width="96" height="192" rx="0"/>
<rect class="tint blk" x="288" y="0" width="96" height="96" rx="0"/>
<rect class="accent blk" x="384" y="192" width="96" height="96" rx="0"/>
<line class="rule" x1="192" y1="0" x2="192" y2="288"/>
<line class="rule" x1="288" y1="0" x2="288" y2="288"/>
<line class="rule" x1="384" y1="0" x2="384" y2="288"/>
<line class="rule" x1="0" y1="96" x2="480" y2="96"/>
<line class="rule" x1="0" y1="192" x2="480" y2="192"/>
</svg>
</div>
<div class="words">
<h1 class="name">Modernist</h1>
<p class="tag">Flat, architectural, set entirely in Archivo.</p>
</div>
</div>
</body>
</html>
